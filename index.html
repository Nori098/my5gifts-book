<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY 5 GIFTS</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #f3f3f3;
  overflow: hidden;
  font-family: sans-serif;
}

.viewer {
  position: relative;
  width: 100%;
  height: 100%;
}

.book {
  display: flex;
  width: 100%;
  height: 100%;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.book::-webkit-scrollbar {
  display: none;
}

.page {
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  scroll-snap-align: start;
  display: flex;
  align-items: center;
  justify-content: center;
}

.page img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.counter {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.55);
  color: white;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 14px;
  z-index: 10;
}

.nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 50%;
  background: rgba(0,0,0,0.45);
  color: white;
  font-size: 24px;
  cursor: pointer;
  z-index: 10;
}

.prev {
  left: 14px;
}

.next {
  right: 14px;
}

.hint {
  position: absolute;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,255,255,0.88);
  color: #333;
  padding: 7px 12px;
  border-radius: 18px;
  font-size: 13px;
  z-index: 10;
  transition: opacity 0.5s ease;
}

@media (max-width: 600px) {
  .nav {
    width: 38px;
    height: 38px;
    font-size: 21px;
  }

  .counter {
    bottom: 12px;
  }

  .hint {
    top: 10px;
  }
}
</style>
</head>

<body>

<div class="viewer">

  <div class="hint" id="hint">← スワイプして読む →</div>

  <button class="nav prev" id="prev">‹</button>
  <button class="nav next" id="next">›</button>

  <div class="book" id="book">

    <div class="page">
      <img src="01.jpg" alt="表紙">
    </div>

    <div class="page">
      <img src="02.jpg" alt="2ページ">
    </div>

    <div class="page">
      <img src="03.jpg" alt="3ページ">
    </div>

  </div>

  <div class="counter" id="counter">1 / 3</div>

</div>

<script>
const book = document.getElementById("book");
const pages = document.querySelectorAll(".page");
const counter = document.getElementById("counter");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const hint = document.getElementById("hint");

let currentPage = 0;

function goToPage(index) {
  if (index < 0) index = 0;
  if (index >= pages.length) index = pages.length - 1;

  currentPage = index;

  book.scrollTo({
    left: book.clientWidth * currentPage,
    behavior: "smooth"
  });

  updateCounter();
}

function updateCounter() {
  counter.textContent = `${currentPage + 1} / ${pages.length}`;
}

prev.addEventListener("click", () => {
  goToPage(currentPage - 1);
});

next.addEventListener("click", () => {
  goToPage(currentPage + 1);
});

book.addEventListener("scroll", () => {
  currentPage = Math.round(book.scrollLeft / book.clientWidth);
  updateCounter();

  if (currentPage > 0) {
    hint.style.opacity = "0";
  }
});

setTimeout(() => {
  hint.style.opacity = "0";
}, 4000);
</script>

</body>
</html>
