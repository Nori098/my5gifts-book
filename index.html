<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY 5 GIFTS</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #f3f3f3;
  overflow: hidden;
  font-family: sans-serif;
}

.viewer {
  position: relative;
  width: 100%;
  height: 100%;
}

.book {
  display: flex;
  width: 100%;
  height: 100%;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.book::-webkit-scrollbar {
  display: none;
}

.page {
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  scroll-snap-align: start;
  display: flex;
  align-items: center;
  justify-content: center;
}

.page img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

/* ページ番号 */
.counter {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.95);
  background: rgba(0,0,0,0.22);
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 11px;
  letter-spacing: 0.4px;
  z-index: 10;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

/* PC用の左右ボタン */
.nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 50%;
  background: rgba(0,0,0,0.30);
  color: white;
  font-size: 22px;
  cursor: pointer;
  z-index: 10;
}

.prev {
  left: 12px;
}

.next {
  right: 12px;
}

/* スマホでは矢印を消す */
@media (max-width: 700px) {
  .nav {
    display: none;
  }
}
</style>
</head>

<body>

<div class="viewer">

  <button class="nav prev" id="prev">‹</button>
  <button class="nav next" id="next">›</button>

  <div class="book" id="book"></div>

  <div class="counter" id="counter">1 / 13</div>

</div>

<script>

/* -------------------------
   ここだけ変えればページ数変更OK
------------------------- */

const totalPages = 13;


/* -------------------------
   ページを自動生成
------------------------- */

const book = document.getElementById("book");
const counter = document.getElementById("counter");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

for (let i = 1; i <= totalPages; i++) {

  const page = document.createElement("div");
  page.className = "page";

  const img = document.createElement("img");

  const fileNumber = String(i).padStart(2, "0");

  img.src = `${fileNumber}.jpg`;
  img.alt = `${i}ページ`;

  page.appendChild(img);
  book.appendChild(page);
}


/* -------------------------
   ページ移動
------------------------- */

let currentPage = 0;

function goToPage(index) {

  if (index < 0) {
    index = 0;
  }

  if (index >= totalPages) {
    index = totalPages - 1;
  }

  currentPage = index;

  book.scrollTo({
    left: book.clientWidth * currentPage,
    behavior: "smooth"
  });

  updateCounter();
}


/* -------------------------
   ページ番号
------------------------- */

function updateCounter() {
  counter.textContent =
    `${currentPage + 1} / ${totalPages}`;
}


/* -------------------------
   PC左右ボタン
------------------------- */

prev.addEventListener("click", () => {
  goToPage(currentPage - 1);
});

next.addEventListener("click", () => {
  goToPage(currentPage + 1);
});


/* -------------------------
   スワイプ後のページ番号更新
------------------------- */

let scrollTimer;

book.addEventListener("scroll", () => {

  clearTimeout(scrollTimer);

  scrollTimer = setTimeout(() => {

    currentPage =
      Math.round(book.scrollLeft / book.clientWidth);

    updateCounter();

  }, 50);

});


/* -------------------------
   画面回転・サイズ変更対策
------------------------- */

window.addEventListener("resize", () => {

  book.scrollTo({
    left: book.clientWidth * currentPage,
    behavior: "auto"
  });

});

</script>

</body>
</html>
