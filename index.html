<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY 5 GIFTS</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #f3f3f3;
  overflow: hidden;
  font-family: sans-serif;
}

.viewer {
  position: relative;
  width: 100%;
  height: 100%;
}

.book {
  display: flex;
  width: 100%;
  height: 100%;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.book::-webkit-scrollbar {
  display: none;
}

.page {
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  scroll-snap-align: start;
  display: flex;
  align-items: center;
  justify-content: center;
}

.page img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

/* ページ番号 */
.counter {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.95);
  background: rgba(0,0,0,0.22);
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 11px;
  letter-spacing: 0.4px;
  z-index: 10;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

/* PC用左右ボタン */
.nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 50%;
  background: rgba(0,0,0,0.30);
  color: white;
  font-size: 22px;
  cursor: pointer;
  z-index: 10;
}

.prev {
  left: 12px;
}

.next {
  right: 12px;
}

/* PDFボタン */
.pdf-button {
  position: absolute;
  left: 50%;
  bottom: 48px;
  transform: translate(-50%, 20px);

  z-index: 20;

  display: block;

  padding: 13px 24px;
  border-radius: 999px;

  background: rgba(10, 20, 45, 0.90);
  color: #ffffff;

  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.4px;

  box-shadow: 0 5px 20px rgba(0,0,0,0.28);

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  transition:
    opacity 0.35s ease,
    transform 0.35s ease,
    visibility 0.35s ease;
}

.pdf-button.show {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translate(-50%, 0);
}

/* スマホ */
@media (max-width: 700px) {

  .nav {
    display: none;
  }

  .pdf-button {
    bottom: 45px;
    padding: 12px 20px;
    font-size: 13px;
    white-space: nowrap;
  }

}
</style>
</head>

<body>

<div class="viewer">

  <button class="nav prev" id="prev">‹</button>
  <button class="nav next" id="next">›</button>

  <div class="book" id="book"></div>

  <div class="counter" id="counter">1 / 13</div>

  <a
    href="https://drive.google.com/file/d/1jiGaba8H41Y-QbzUgw7iygW8gfO7U7af/view?usp=sharing"
    target="_blank"
    rel="noopener noreferrer"
    class="pdf-button"
    id="pdfButton"
  >
    PDF版を開く・保存する
  </a>

</div>

<script>

/* =========================
   BOOK設定
========================= */

const totalPages = 13;


/* =========================
   要素取得
========================= */

const book = document.getElementById("book");
const counter = document.getElementById("counter");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const pdfButton = document.getElementById("pdfButton");


/* =========================
   01.jpg〜13.jpgを自動生成
========================= */

for (let i = 1; i <= totalPages; i++) {

  const page = document.createElement("div");
  page.className = "page";

  const img = document.createElement("img");

  const fileNumber =
    String(i).padStart(2, "0");

  img.src = `${fileNumber}.jpg`;
  img.alt = `${i}ページ`;

  page.appendChild(img);
  book.appendChild(page);
}


/* =========================
   現在ページ
========================= */

let currentPage = 0;


/* =========================
   UI更新
========================= */

function updateUI() {

  counter.textContent =
    `${currentPage + 1} / ${totalPages}`;

  /* 最後のページだけPDFボタン表示 */
  if (currentPage === totalPages - 1) {

    pdfButton.classList.add("show");

  } else {

    pdfButton.classList.remove("show");

  }
}


/* =========================
   ページ移動
========================= */

function goToPage(index) {

  if (index < 0) {
    index = 0;
  }

  if (index >= totalPages) {
    index = totalPages - 1;
  }

  currentPage = index;

  book.scrollTo({
    left: book.clientWidth * currentPage,
    behavior: "smooth"
  });

  updateUI();
}


/* =========================
   PC左右ボタン
========================= */

prev.addEventListener("click", () => {
  goToPage(currentPage - 1);
});

next.addEventListener("click", () => {
  goToPage(currentPage + 1);
});


/* =========================
   スワイプ時
========================= */

let scrollTimer;

book.addEventListener("scroll", () => {

  clearTimeout(scrollTimer);

  scrollTimer = setTimeout(() => {

    currentPage =
      Math.round(
        book.scrollLeft /
        book.clientWidth
      );

    updateUI();

  }, 50);

});


/* =========================
   画面回転・サイズ変更
========================= */

window.addEventListener("resize", () => {

  book.scrollTo({
    left:
      book.clientWidth *
      currentPage,
    behavior: "auto"
  });

});


/* 最初の状態 */
updateUI();

</script>

</body>
</html>
